<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>People Economics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0d0e11}
.hrx{--bg:#0d0e11;--s1:#15161a;--s2:#1c1d22;--line:#2b2c33;--ink:#eceae4;--mut:#9ea0a9;--acc:#7c93ff;--acc2:#a78bfa;--ok:#3ddc97;--warn:#ffb020;--bad:#ff5d5d;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.hrx *,.hrx *::before,.hrx *::after{box-sizing:border-box}
.hrx button{font:inherit;color:inherit;cursor:pointer}
.hrx :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hrx .wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.hrx .top{position:sticky;top:0;z-index:30;background:rgba(13,14,17,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrx .top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.hrx .back{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap}
.hrx .back:hover{color:var(--ink);border-color:var(--acc)}
.hrx .brand{display:flex;align-items:center;gap:10px;min-width:0}
.hrx .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;flex:none}
.hrx .logo svg{width:16px;height:16px}
.hrx .brand b{display:block;font-size:15px;letter-spacing:-.01em}
.hrx .brand small{display:block;font-size:12px;color:var(--mut);max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrx .tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:4px;margin-left:auto}
.hrx .tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.hrx .tabs button[aria-selected=true]{background:var(--acc);color:#0b0c10}
.hrx .lang{position:relative;flex:none}
.hrx .lang-btn{display:inline-flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;letter-spacing:.06em}
.hrx .lang-btn:hover,.hrx .lang-btn[aria-expanded=true]{border-color:var(--acc)}
.hrx .lang-btn .chev{transition:transform .25s}.hrx .lang-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.hrx .lang-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;list-style:none;margin:0;padding:6px;min-width:min(220px,calc(100vw - 32px));background:var(--s2);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -20px #000;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility 0s linear .18s}
.hrx .lang.open .lang-menu{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.hrx .lang-menu li{display:flex;justify-content:space-between;gap:20px;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--mut);cursor:pointer;outline:none}
.hrx .lang-menu li b{font-size:11px;letter-spacing:.1em}
.hrx .lang-menu li:hover,.hrx .lang-menu li:focus-visible{background:rgba(255,255,255,.07);color:var(--ink)}
.hrx .lang-menu li[aria-selected=true]{color:var(--ink)}.hrx .lang-menu li[aria-selected=true] b{color:var(--acc)}
.hrx main{padding-block:clamp(30px,5vw,56px) clamp(30px,5vw,56px)}
.hrx .actions{margin-bottom:4px}
.hrx h1,.hrx h2,.hrx h3,.hrx h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.hrx .head h1{font:500 clamp(26px,3.6vw,42px)/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em}
.hrx .head p{margin:10px 0 0;color:var(--mut);max-width:70ch;font-size:15px}
.hrx .grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:20px;margin-top:26px;align-items:start}
.hrx .stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.hrx .card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.2vw,24px);min-width:0}
.hrx .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:600;margin-bottom:16px}
.hrx .fld{margin-bottom:20px}
.hrx .fl{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
.hrx .fl label{flex:1;min-width:0}
.hrx .fl output{font-weight:700;font-variant-numeric:tabular-nums;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px;white-space:nowrap}
.hrx .tipb{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;display:grid;place-items:center;padding:0;flex:none}
.hrx .tipb:hover,.hrx .tipb:focus-visible{color:var(--ink);border-color:var(--acc)}
.hrx input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;margin:0;cursor:pointer;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--s2) var(--p,50%));border:0}
.hrx input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.hrx input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.hrx input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.hrx details.as{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.hrx details.as summary{cursor:pointer;font-size:13px;color:var(--mut);font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hrx details.as summary::before{content:"▸";transition:transform .2s}.hrx details.as[open] summary::before{transform:rotate(90deg)}
.hrx .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hrx .k{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2vw,22px);min-width:0}
.hrx .k.wide{grid-column:1/-1}
.hrx .kt{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600;margin-bottom:10px}
.hrx .big{font-size:clamp(28px,3.4vw,40px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;overflow-wrap:anywhere}
.hrx .sub{font-size:13px;color:var(--mut);margin-top:6px}
.hrx .bad{color:var(--bad)}.hrx .warn{color:var(--warn)}.hrx .ok{color:var(--ok)}
.hrx .gauge{position:relative;height:10px;border-radius:99px;margin:14px 0 8px;background:linear-gradient(90deg,var(--ok) 0 35%,var(--warn) 35% 65%,var(--bad) 65% 100%);opacity:.92}
.hrx .gauge i{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.45);transition:left .35s cubic-bezier(.2,.8,.2,1);transform:translateX(-2px)}
.hrx .gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.hrx .roirow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.hrx .mini{background:var(--s2);border-radius:12px;padding:10px 12px;min-width:0}
.hrx .mini span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.hrx .mini b{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hrx .ba{display:grid;gap:8px;margin-top:14px}
.hrx .ba div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:13px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.hrx .ba div span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hrx .ba .arr{color:var(--mut);padding:0 4px}
.hrx svg.chart{width:100%;height:auto;display:block;overflow:visible}
.hrx .chart text{fill:var(--mut);font-size:11px;font-family:Inter,sans-serif}
.hrx .actions{display:flex;flex-wrap:wrap;gap:10px}
.hrx .btn{border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;transition:border-color .15s,transform .1s}
.hrx .btn:hover{border-color:var(--acc)}.hrx .btn:active{transform:translateY(1px)}
.hrx .btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0c10;border-color:transparent}
.hrx .ctx{font-size:13px;color:var(--mut);margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:9px 13px}
.hrx .meter{height:10px;border-radius:99px;background:var(--s2);overflow:hidden;margin:10px 0 8px}
.hrx .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.hrx .meter.over i{background:linear-gradient(90deg,var(--warn),var(--bad))}
.hrx .mline{display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}
.hrx .bl{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.hrx .it{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px;align-items:center;transition:border-color .2s}
.hrx .it.on{border-color:rgba(124,147,255,.55)}
.hrx .it h3{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrx .it p{margin:6px 0 0;font-size:13px;color:var(--mut)}
.hrx .chip{font-size:11px;font-weight:600;border-radius:99px;padding:2px 9px;background:rgba(124,147,255,.14);color:var(--acc);letter-spacing:.02em}
.hrx .ctl .fl{margin-bottom:8px;font-size:13px}
.hrx .itm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.hrx .roib{font-weight:700;font-variant-numeric:tabular-nums}
.hrx .linkb{border:0;background:none;color:var(--acc);font-size:12px;font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.hrx .outg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.hrx .mixbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--s2);margin:12px 0 10px}
.hrx .mixbar i{display:block;height:100%;transition:width .3s}
.hrx .leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut)}
.hrx .leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:6px}
.hrx footer{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--mut);font-size:12px}
.hrx #tipbox{position:fixed;z-index:200;max-width:min(340px,calc(100vw - 24px));background:#23242b;border:1px solid #3a3b44;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:var(--ink);box-shadow:0 20px 50px -10px #000;pointer-events:none}
.hrx dialog{background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 40px 100px -20px #000}
.hrx dialog::backdrop{background:rgba(5,5,8,.7);backdrop-filter:blur(4px)}
.hrx .mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.hrx .mh h3{flex:1;font-size:17px}
.hrx .mx{border:1px solid var(--line);background:none;border-radius:10px;width:34px;height:34px;font-size:18px;line-height:1}
.hrx .mb{padding:20px 22px;overflow:auto;max-height:calc(100vh - 190px)}
.hrx .mb p{margin:0 0 12px;font-size:14.5px}
.hrx .mb h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:18px 0 8px}
.hrx .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.hrx table{width:100%;border-collapse:collapse;font-size:13.5px}
.hrx th,.hrx td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.hrx th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.hrx td.n,.hrx th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrx .fm{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mut);margin:0 0 6px}
.hrx .note{font-size:12.5px;color:var(--mut);border-left:2px solid var(--acc);padding-left:12px;margin-top:14px}
body.emb .hrx .back,body.emb .hrx footer{display:none}
@media (max-width:980px){.hrx .grid{grid-template-columns:minmax(0,1fr)}.hrx .tabs{margin-left:0;order:5;width:100%}.hrx .tabs button{flex:1}.hrx .lang{margin-left:auto}.hrx .it{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.hrx .kpis,.hrx .outg,.hrx .roirow{grid-template-columns:minmax(0,1fr)}.hrx .brand small{display:none}}
@media (prefers-reduced-motion:reduce){.hrx *{transition:none!important}}
.hrx .span2{grid-column:span 2}
@media (max-width:560px){.hrx .span2{grid-column:auto}}

.hrx .grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.hrx .side{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);position:sticky;top:84px}
.hrx .cathead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.hrx .h2s{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:600;margin:0 0 4px}
.hrx .filters{display:flex;gap:6px;flex-wrap:wrap}
.hrx .filters button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--mut)}
.hrx .filters button[aria-pressed=true]{background:var(--ink);color:#0b0c10;border-color:var(--ink)}
.hrx .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hrx .cd{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);cursor:grab;transition:border-color .2s,opacity .2s,transform .15s}
.hrx .cd:hover{border-color:#43454f}
.hrx .cd.on{border-color:var(--acc);background:linear-gradient(180deg,rgba(124,147,255,.10),var(--s1))}
.hrx .cd.na{opacity:.5}
.hrx .cd.dragging{opacity:.4;transform:scale(.98)}
.hrx .cd.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.hrx .cdh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hrx .cd h3{font-size:14.5px;line-height:1.3;letter-spacing:-.01em;min-height:2.6em}
.hrx .cost{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hrx .ty{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;letter-spacing:.02em}
.hrx .ty.quick{background:rgba(255,176,32,.15);color:var(--warn)}.hrx .ty.mid{background:rgba(255,255,255,.08);color:var(--mut)}.hrx .ty.sys{background:rgba(61,220,151,.14);color:var(--ok)}
.hrx .dots{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;font-size:11.5px;color:var(--mut);align-items:center}
.hrx .dots .bar{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.hrx .dots .bar i{height:5px;border-radius:3px;background:var(--s2)}
.hrx .dots .bar i.f{background:var(--c)}
.hrx .dots b{color:var(--ink);font-variant-numeric:tabular-nums}
.hrx .cd .btn{padding:8px 12px;font-size:13px;width:100%}
.hrx .cd.on .btn{background:none}
.hrx .drop{transition:border-color .2s,background .2s}
.hrx .drop.over{border-color:var(--acc);background:rgba(124,147,255,.08)}
.hrx .bkrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.hrx .bkrow:first-child{border-top:0}
.hrx .bkrow b{font-variant-numeric:tabular-nums}
.hrx .bkrow button{border:1px solid var(--line);background:none;border-radius:8px;width:26px;height:26px;line-height:1;color:var(--mut)}
.hrx .bkrow button:hover{color:var(--bad);border-color:var(--bad)}
.hrx .bkempty{font-size:13px;color:var(--mut);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.hrx .wm i{background:linear-gradient(90deg,var(--ok),var(--acc))}
.hrx .wallet.low .wm i{background:linear-gradient(90deg,var(--warn),var(--bad))}
.hrx .gauge.g3{background:linear-gradient(90deg,var(--bad) 0 40%,var(--warn) 40% 70%,var(--ok) 70% 100%)}
.hrx .strat{margin-top:6px;font-size:16px;font-weight:700}.hrx .strat p{font-size:13px;font-weight:400;color:var(--mut);margin:4px 0 0}
.hrx .ins{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hrx .ins li{font-size:13px;color:var(--ink);padding-left:16px;position:relative}
.hrx .ins li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--acc))}
.hrx #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:300;background:#2a1d1d;border:1px solid var(--bad);color:var(--ink);padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.hrx #toast.show{opacity:1;transform:translate(-50%,0)}

<script>
const L={
brandSub:["ROI calculator & budget simulator for HR leaders","ROI-калькулятор и симулятор бюджета для HR-руководителей","Kalkulator ROI i symulator budżetu dla liderów HR","Calculadora de ROI y simulador de presupuesto para líderes de RR. HH.","ROI-калькулятор і симулятор бюджету для HR-керівників"],
back:["← Portfolio","← Портфолио","← Portfolio","← Portafolio","← Портфоліо"],
tab1:["Cost of burnout & ROI","Цена выгорания и ROI","Koszt wypalenia i ROI","Coste del burnout y ROI","Ціна вигорання та ROI"],
m1title:["The cost of burnout and the payback of initiatives","Цена выгорания и окупаемость инициатив","Koszt wypalenia i zwrot z inicjatyw","El coste del burnout y el retorno de las iniciativas","Ціна вигорання та окупність ініціатив"],
m1sub:["Link people metrics to financial loss and justify the budget for preventive measures.","Свяжите People-метрики с финансовыми потерями и обоснуйте бюджет на превентивные меры.","Powiąż metryki People ze stratami finansowymi i uzasadnij budżet na działania prewencyjne.","Conecta las métricas de personas con las pérdidas financieras y justifica el presupuesto de medidas preventivas.","Пов'яжіть People-метрики з фінансовими втратами та обґрунтуйте бюджет на превентивні заходи."],
inputs:["Inputs","Входные данные","Dane wejściowe","Datos de entrada","Вхідні дані"],
f_n:["Headcount","Численность сотрудников","Liczba pracowników","Plantilla","Чисельність співробітників"],
f_attr:["Attrition rate (annual)","Текучесть (attrition rate, год)","Rotacja (attrition rate, rocznie)","Tasa de rotación (attrition rate, anual)","Плинність (attrition rate, рік)"],
f_enps:["Current eNPS","Текущий eNPS","Aktualny eNPS","eNPS actual","Поточний eNPS"],
f_freq:["Pulse survey cadence","Частота пульс-опросов","Częstotliwość badań pulse","Frecuencia de encuestas pulse","Частота пульс-опитувань"],
f_inv:["Preventive programme, per employee / year","Превентивная программа, на сотрудника / год","Program prewencyjny, na pracownika / rok","Programa preventivo, por empleado / año","Превентивна програма, на співробітника / рік"],
tip_n:["Scales every financial result. Exits = headcount × attrition rate.","Масштабирует все финансовые результаты. Увольнения = численность × текучесть.","Skaluje wszystkie wyniki finansowe. Odejścia = liczba pracowników × rotacja.","Escala todos los resultados financieros. Salidas = plantilla × rotación.","Масштабує всі фінансові результати. Звільнення = чисельність × плинність."],
tip_attr:["Share of employees who leave per year (voluntary + involuntary). Exits = Headcount × Attrition rate.","Доля сотрудников, покидающих компанию за год (по инициативе сотрудника и компании). Увольнения = численность × текучесть.","Odsetek pracowników odchodzących w ciągu roku (z inicjatywy pracownika i firmy). Odejścia = liczba pracowników × rotacja.","Porcentaje de empleados que salen al año (voluntarias e involuntarias). Salidas = plantilla × rotación.","Частка співробітників, що залишають компанію за рік (з ініціативи працівника та компанії). Звільнення = чисельність × плинність."],
tip_enps:["Employee Net Promoter Score = % promoters − % detractors. A leading indicator of attrition and burnout. Range −100…+100.","Employee Net Promoter Score = % промоутеров − % критиков. Опережающий индикатор текучести и выгорания. Диапазон −100…+100.","Employee Net Promoter Score = % promotorów − % krytyków. Wskaźnik wyprzedzający rotacji i wypalenia. Zakres −100…+100.","Employee Net Promoter Score = % promotores − % detractores. Indicador adelantado de rotación y burnout. Rango −100…+100.","Employee Net Promoter Score = % промоутерів − % критиків. Випереджальний індикатор плинності та вигорання. Діапазон −100…+100."],
tip_freq:["The less often you listen, the later risk reaches HRBPs and managers. Weights 20% of the Burnout Index.","Чем реже вы слушаете команду, тем позже риск доходит до HRBP и руководителей. Вес в индексе выгорания: 20%.","Im rzadziej słuchasz zespołu, tym później ryzyko dociera do HRBP i menedżerów. Waga w indeksie wypalenia: 20%.","Cuanto menos se escucha, más tarde llega el riesgo a HRBP y managers. Peso en el índice de burnout: 20 %.","Що рідше ви слухаєте команду, то пізніше ризик доходить до HRBP і керівників. Вага в індексі вигорання: 20%."],
tip_inv:["Annual spend on preventive measures (manager enablement, stay interviews, workload and wellbeing). Cost = Headcount × investment per employee. Returns have diminishing effect: capture = 70% × (1 − e^(−investment/250)).","Годовые затраты на превентивные меры (развитие руководителей, stay-интервью, нагрузка и wellbeing). Стоимость = численность × инвестиции на сотрудника. Эффект убывающий: захват = 70% × (1 − e^(−инвестиции/250)).","Roczne wydatki na działania prewencyjne (rozwój menedżerów, stay interviews, obciążenie i wellbeing). Koszt = liczba pracowników × inwestycja na pracownika. Efekt maleje: udział = 70% × (1 − e^(−inwestycja/250)).","Gasto anual en medidas preventivas (desarrollo de managers, stay interviews, carga de trabajo y wellbeing). Coste = plantilla × inversión por empleado. Rendimientos decrecientes: captura = 70 % × (1 − e^(−inversión/250)).","Річні витрати на превентивні заходи (розвиток керівників, stay-інтерв'ю, навантаження та wellbeing). Вартість = чисельність × інвестиції на співробітника. Ефект спадний: захоплення = 70% × (1 − e^(−інвестиції/250))."],
freq0:["Once a year","Раз в год","Raz w roku","Una vez al año","Раз на рік"],
freq1:["Twice a year","Раз в полгода","Co pół roku","Cada seis meses","Раз на півроку"],
freq2:["Quarterly","Ежеквартально","Kwartalnie","Trimestral","Щокварталу"],
freq3:["Monthly","Ежемесячно","Miesięcznie","Mensual","Щомісяця"],
freq4:["Every two weeks","Раз в две недели","Co dwa tygodnie","Quincenal","Раз на два тижні"],
freq5:["Weekly","Еженедельно","Co tydzień","Semanal","Щотижня"],
assump:["Model assumptions","Допущения модели","Założenia modelu","Supuestos del modelo","Припущення моделі"],
a_sal:["Average fully-loaded annual salary","Средняя годовая стоимость сотрудника (fully-loaded)","Średni roczny koszt pracownika (fully-loaded)","Coste anual medio por empleado (fully-loaded)","Середня річна вартість співробітника (fully-loaded)"],
a_fac:["Replacement cost, % of salary","Стоимость замены, % от зарплаты","Koszt zastąpienia, % wynagrodzenia","Coste de reemplazo, % del salario","Вартість заміни, % від зарплати"],
a_prev:["Preventable share of attrition","Доля предотвратимой текучести","Udział rotacji do uniknięcia","Parte evitable de la rotación","Частка плинності, якої можна уникнути"],
tip_sal:["Salary + taxes + benefits. Drives the cost of one exit.","Зарплата + налоги + льготы. Определяет стоимость одного ухода.","Wynagrodzenie + podatki + benefity. Wyznacza koszt jednego odejścia.","Salario + impuestos + beneficios. Determina el coste de una salida.","Зарплата + податки + пільги. Визначає вартість одного звільнення."],
tip_fac:["Industry benchmarks range from 50% to 200% of annual salary (recruiting, onboarding, ramp-up, handover). Default 70%. Cost per exit = salary × factor.","Отраслевые ориентиры: от 50% до 200% годовой зарплаты (подбор, онбординг, выход на продуктивность, передача дел). По умолчанию 70%. Стоимость ухода = зарплата × коэффициент.","Benchmarki branżowe: od 50% do 200% rocznego wynagrodzenia (rekrutacja, onboarding, dojście do produktywności, przekazanie zadań). Domyślnie 70%. Koszt odejścia = wynagrodzenie × współczynnik.","Referencias del sector: del 50 % al 200 % del salario anual (selección, onboarding, curva de productividad, traspaso). Por defecto 70 %. Coste de salida = salario × factor.","Галузеві орієнтири: від 50% до 200% річної зарплати (підбір, онбординг, вихід на продуктивність, передача справ). За замовчуванням 70%. Вартість звільнення = зарплата × коефіцієнт."],
tip_prev:["Share of exits that targeted measures can realistically influence (excludes retirement, relocation, etc.).","Доля уходов, на которые реально влияют целевые меры (без пенсии, переезда и т. п.).","Odsetek odejść, na które realnie wpływają działania celowane (bez emerytury, przeprowadzki itp.).","Parte de las salidas que las medidas específicas pueden influir de forma realista (sin jubilación, traslados, etc.).","Частка звільнень, на які реально впливають цільові заходи (без пенсії, переїзду тощо)."],
k_loss:["Cost of turnover","Финансовые потери от текучести","Koszt rotacji","Coste de la rotación","Фінансові втрати від плинності"],
k_loss_sub:["≈ {x} exits × {y} per exit","≈ {x} увольнений × {y} за уход","≈ {x} odejść × {y} za odejście","≈ {x} salidas × {y} por salida","≈ {x} звільнень × {y} за звільнення"],
k_loss_pay:["{x}% of annual payroll","{x}% годового фонда оплаты труда","{x}% rocznego funduszu płac","{x} % de la masa salarial anual","{x}% річного фонду оплати праці"],
tip_loss:["Cost of turnover = exits × salary × replacement factor. Breakdown: recruiting 30%, onboarding 15%, lost productivity during ramp-up 35%, knowledge handover & manager time 20%.","Потери = уходы × зарплата × коэффициент замены. Структура: подбор 30%, онбординг 15%, потеря продуктивности при выходе на уровень 35%, передача знаний и время руководителя 20%.","Koszt rotacji = odejścia × wynagrodzenie × współczynnik zastąpienia. Struktura: rekrutacja 30%, onboarding 15%, utrata produktywności w okresie wdrożenia 35%, przekazanie wiedzy i czas menedżera 20%.","Coste de la rotación = salidas × salario × factor de reemplazo. Desglose: selección 30 %, onboarding 15 %, pérdida de productividad en la curva de aprendizaje 35 %, traspaso de conocimiento y tiempo del manager 20 %.","Втрати = звільнення × зарплата × коефіцієнт заміни. Структура: підбір 30%, онбординг 15%, втрата продуктивності під час виходу на рівень 35%, передача знань і час керівника 20%."],
k_bi:["Burnout Index","Индекс риска выгорания","Indeks ryzyka wypalenia","Índice de riesgo de burnout","Індекс ризику вигорання"],
lvl_low:["Low","Низкий","Niski","Bajo","Низький"],
lvl_mid:["Medium","Средний","Średni","Medio","Середній"],
lvl_crit:["Critical","Критический","Krytyczny","Crítico","Критичний"],
tip_bi:["Index (0–100) = 50% × eNPS gap + 30% × attrition pressure + 20% × listening gap. eNPS gap = (80 − eNPS)/110; attrition pressure = (attrition − 5)/35; listening gap = 1 − cadence/5. Bands: <35 low, 35–65 medium, >65 critical.","Индекс (0–100) = 50% × разрыв eNPS + 30% × давление текучести + 20% × разрыв обратной связи. Разрыв eNPS = (80 − eNPS)/110; давление текучести = (текучесть − 5)/35; разрыв обратной связи = 1 − частота/5. Зоны: <35 низкий, 35–65 средний, >65 критический.","Indeks (0–100) = 50% × luka eNPS + 30% × presja rotacji + 20% × luka w słuchaniu. Luka eNPS = (80 − eNPS)/110; presja rotacji = (rotacja − 5)/35; luka w słuchaniu = 1 − częstotliwość/5. Strefy: <35 niski, 35–65 średni, >65 krytyczny.","Índice (0–100) = 50 % × brecha de eNPS + 30 % × presión de rotación + 20 % × brecha de escucha. Brecha eNPS = (80 − eNPS)/110; presión de rotación = (rotación − 5)/35; brecha de escucha = 1 − frecuencia/5. Zonas: <35 bajo, 35–65 medio, >65 crítico.","Індекс (0–100) = 50% × розрив eNPS + 30% × тиск плинності + 20% × розрив зворотного зв'язку. Розрив eNPS = (80 − eNPS)/110; тиск плинності = (плинність − 5)/35; розрив зворотного зв'язку = 1 − частота/5. Зони: <35 низький, 35–65 середній, >65 критичний."],
bi_hint:["Driven by eNPS, listening cadence and attrition pressure","Формируют eNPS, частота обратной связи и давление текучести","Kształtują eNPS, częstotliwość słuchania i presja rotacji","Lo determinan el eNPS, la frecuencia de escucha y la presión de rotación","Формують eNPS, частота зворотного зв'язку та тиск плинності"],
k_roi:["Projected ROI of HR initiatives","Прогнозируемый ROI HR-инициатив","Prognozowany ROI inicjatyw HR","ROI previsto de las iniciativas de RR. HH.","Прогнозований ROI HR-ініціатив"],
k_sav:["Savings from avoided exits","Экономия от предотвращённых уходов","Oszczędności z uniknięcia odejść","Ahorro por salidas evitadas","Економія від запобігання звільненням"],
k_cost:["Programme cost","Стоимость программы","Koszt programu","Coste del programa","Вартість програми"],
k_net:["Net annual benefit","Чистая годовая выгода","Roczna korzyść netto","Beneficio neto anual","Чиста річна вигода"],
k_roi_pct:["ROI","ROI","ROI","ROI","ROI"],
k_pb:["Payback","Срок окупаемости","Okres zwrotu","Periodo de recuperación","Термін окупності"],

tip_roi:["ROI = (savings − cost) / cost. Savings = avoided exits × cost per exit. Avoided exits = headcount × attrition × preventable share × capture × effectiveness. Effectiveness = 0.6 + 0.4 × Burnout Index/100. Productivity gains are excluded (conservative).","ROI = (экономия − затраты) / затраты. Экономия = предотвращённые уходы × стоимость ухода. Предотвращённые уходы = численность × текучесть × доля предотвратимой × захват × эффективность. Эффективность = 0,6 + 0,4 × индекс выгорания/100. Прирост продуктивности не учитывается (консервативно).","ROI = (oszczędności − koszt) / koszt. Oszczędności = uniknięte odejścia × koszt odejścia. Uniknięte odejścia = liczba pracowników × rotacja × udział do uniknięcia × udział skuteczny × skuteczność. Skuteczność = 0,6 + 0,4 × indeks wypalenia/100. Wzrost produktywności pominięty (podejście zachowawcze).","ROI = (ahorro − coste) / coste. Ahorro = salidas evitadas × coste por salida. Salidas evitadas = plantilla × rotación × parte evitable × captura × eficacia. Eficacia = 0,6 + 0,4 × índice de burnout/100. No se incluyen ganancias de productividad (criterio conservador).","ROI = (економія − витрати) / витрати. Економія = запобігнуті звільнення × вартість звільнення. Запобігнуті звільнення = чисельність × плинність × частка запобіжної × захоплення × ефективність. Ефективність = 0,6 + 0,4 × індекс вигорання/100. Приріст продуктивності не враховано (консервативно)."],

ex_p1:["At {n} employees, a {attr}% attrition rate means about {leavers} exits a year. At a fully-loaded replacement cost of {cpd} per exit, turnover costs the business {loss} annually, which is {pct}% of payroll.","При численности {n} человек текучесть {attr}% означает около {leavers} уходов в год. При полной стоимости замены {cpd} за уход текучесть обходится бизнесу в {loss} ежегодно, то есть {pct}% фонда оплаты труда.","Przy zatrudnieniu {n} osób rotacja {attr}% oznacza około {leavers} odejść rocznie. Przy pełnym koszcie zastąpienia {cpd} za odejście rotacja kosztuje firmę {loss} rocznie, czyli {pct}% funduszu płac.","Con {n} empleados, una rotación del {attr} % implica unas {leavers} salidas al año. Con un coste de reemplazo total de {cpd} por salida, la rotación cuesta al negocio {loss} al año, el {pct} % de la masa salarial.","При чисельності {n} осіб плинність {attr}% означає близько {leavers} звільнень на рік. За повної вартості заміни {cpd} за звільнення плинність коштує бізнесу {loss} щороку, тобто {pct}% фонду оплати праці."],
ex_p2:["Current signals: eNPS {enps}, pulse cadence «{freq}», so the Burnout Index is {bi}/100 ({lvl}). The lower the eNPS and the rarer the listening, the later risk becomes visible to management.","Текущие сигналы: eNPS {enps}, частота пульс-опросов «{freq}», индекс выгорания {bi}/100 ({lvl}). Чем ниже eNPS и реже обратная связь, тем позже риск становится виден руководству.","Aktualne sygnały: eNPS {enps}, częstotliwość badań pulse „{freq}”, indeks wypalenia {bi}/100 ({lvl}). Im niższy eNPS i rzadsze słuchanie, tym później ryzyko staje się widoczne dla zarządu.","Señales actuales: eNPS {enps}, frecuencia de pulse «{freq}», índice de burnout {bi}/100 ({lvl}). Cuanto más bajo el eNPS y menos frecuente la escucha, más tarde ve la dirección el riesgo.","Поточні сигнали: eNPS {enps}, частота пульс-опитувань «{freq}», індекс вигорання {bi}/100 ({lvl}). Що нижчий eNPS і рідший зворотний зв'язок, то пізніше ризик стає видимим для керівництва."],
ex_p3:["A preventive programme (HRBP-led manager enablement, stay interviews, workload and wellbeing measures) at {inv} per employee ({cost} a year) is projected to avoid about {avoided} exits and save {sav}. Net benefit: {net}, ROI {roi}%, payback {pb} months. Under a 50% haircut ROI remains {roiC}%.","Превентивная программа (развитие руководителей силами HRBP, stay-интервью, меры по нагрузке и wellbeing) при {inv} на сотрудника ({cost} в год) позволит предотвратить около {avoided} уходов и сэкономить {sav}. Чистая выгода: {net}, ROI {roi}%, окупаемость {pb} мес. При консервативном допущении в 50% эффекта ROI остаётся {roiC}%.","Program prewencyjny (rozwój menedżerów prowadzony przez HRBP, stay interviews, działania dot. obciążenia i wellbeing) przy {inv} na pracownika ({cost} rocznie) pozwoli uniknąć około {avoided} odejść i zaoszczędzić {sav}. Korzyść netto: {net}, ROI {roi}%, zwrot w {pb} mies. Przy założeniu 50% efektu ROI wynosi nadal {roiC}%.","Un programa preventivo (desarrollo de managers liderado por HRBP, stay interviews, medidas de carga y wellbeing) con {inv} por empleado ({cost} al año) evitaría unas {avoided} salidas y ahorraría {sav}. Beneficio neto: {net}, ROI {roi} %, recuperación en {pb} meses. Con solo el 50 % del efecto, el ROI sigue siendo {roiC} %.","Превентивна програма (розвиток керівників силами HRBP, stay-інтерв'ю, заходи щодо навантаження та wellbeing) при {inv} на співробітника ({cost} на рік) дозволить запобігти близько {avoided} звільнень і заощадити {sav}. Чиста вигода: {net}, ROI {roi}%, окупність {pb} міс. За консервативного припущення 50% ефекту ROI залишається {roiC}%."],
ex_p3n:["At the current assumptions, {inv} per employee ({cost} a year) does not pay back (net {net}). Recommendation: narrow the scope to the highest-risk teams or move closer to the optimum of about {opt} per employee.","При текущих допущениях {inv} на сотрудника ({cost} в год) не окупаются (чистый результат {net}). Рекомендация: сузить охват до команд с максимальным риском или приблизиться к оптимуму около {opt} на сотрудника.","Przy obecnych założeniach {inv} na pracownika ({cost} rocznie) nie zwraca się (wynik netto {net}). Rekomendacja: zawęzić zakres do zespołów o najwyższym ryzyku lub zbliżyć się do optimum ok. {opt} na pracownika.","Con los supuestos actuales, {inv} por empleado ({cost} al año) no se recupera (neto {net}). Recomendación: acotar el alcance a los equipos de mayor riesgo o acercarse al óptimo de unos {opt} por empleado.","За поточних припущень {inv} на співробітника ({cost} на рік) не окупаються (чистий результат {net}). Рекомендація: звузити охоплення до команд із максимальним ризиком або наблизитися до оптимуму близько {opt} на співробітника."],
ex_ask:["Decision requested: approve an annual retention and wellbeing budget of {cost}. Targets within 12 months: attrition {a0}% → {a1}%, eNPS {e0} → {e1}, Burnout Index {b0} → {b1}; progress reviewed quarterly through pulse data.","Запрос решения: утвердить годовой бюджет на удержание и wellbeing в размере {cost}. Цели на 12 месяцев: текучесть {a0}% → {a1}%, eNPS {e0} → {e1}, индекс выгорания {b0} → {b1}; прогресс отслеживается ежеквартально по данным пульс-опросов.","Decyzja do podjęcia: zatwierdzenie rocznego budżetu na retencję i wellbeing w wysokości {cost}. Cele na 12 miesięcy: rotacja {a0}% → {a1}%, eNPS {e0} → {e1}, indeks wypalenia {b0} → {b1}; postępy monitorowane kwartalnie na podstawie badań pulse.","Decisión solicitada: aprobar un presupuesto anual de retención y wellbeing de {cost}. Objetivos a 12 meses: rotación {a0} % → {a1} %, eNPS {e0} → {e1}, índice de burnout {b0} → {b1}; seguimiento trimestral con datos de pulse.","Запит на рішення: затвердити річний бюджет на утримання та wellbeing у розмірі {cost}. Цілі на 12 місяців: плинність {a0}% → {a1}%, eNPS {e0} → {e1}, індекс вигорання {b0} → {b1}; прогрес відстежується щокварталу за даними пульс-опитувань."],

const bidx=(e,a,q)=>100*(.5*clamp((80-e)/110,0,1)+.3*clamp((a-5)/35,0,1)+.2*(1-clamp(q,0,5)/5));

function m1(inv){const B=bidx(S.enps,S.attr,S.freq),cap=.7*(1-Math.exp(-inv/250)),eff=.6+.4*B/100,red=S.attr*S.prev/100*cap*eff,avoided=S.n*red/100,sav=avoided*cpd(),cost=S.n*inv;
 return{B,cap,eff,red,avoided,sav,cost,net:sav-cost,roi:cost>0?(sav-cost)/cost*100:0,pb:sav>0&&cost>0?cost/sav*12:null}}
function m1x(){const r=m1(S.inv),gain=18*(1-Math.exp(-S.inv/250)),e1=Math.min(80,S.enps+gain),a1=S.attr-r.red,b1=bidx(e1,a1,S.freq);
 const c=r.sav*.5,cn=c-r.cost;return{...r,e1,a1,b1,leavers:S.n*S.attr/100,loss:S.n*S.attr/100*cpd(),cons:{sav:c,net:cn,roi:r.cost>0?cn/r.cost*100:0}}}
function opt(){let best=0,bv=-1e18;for(let i=0;i<=600;i+=5){const v=m1(i).net;if(v>bv){bv=v;best=i}}return best}

 setText('sav',cur(r.sav));setText('cost',cur(r.cost));setText('net',cur(r.net));$('net').className=r.net>=0?'ok':'bad';

 $('ba').innerHTML=`<div><span style="font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em">${t('ba_t')}</span><span></span></div>`+[['ba_attr',num(S.attr,1)+'%',num(r.a1,1)+'%'],['ba_enps',sg(S.enps),sg(Math.round(r.e1))],['ba_bi',Math.round(r.B),Math.round(r.b1)]].map(([k,a,b])=>`<div><span>${t(k)}</span><span>${a}<span class="arr">→</span><span class="ok">${b}</span></span></div>`).join('');

function chart(r){const W=560,H=190,pl=8,pr=8,pt=14,pb=26,xs=i=>pl+i/600*(W-pl-pr);const pts=[];for(let i=0;i<=600;i+=10)pts.push([i,m1(i).net]);
 let mn=Math.min(0,...pts.map(p=>p[1])),mx=Math.max(1,...pts.map(p=>p[1]));const ys=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb),y0=ys(0),o=opt(),ov=m1(o).net;
 const d=pts.map((p,i)=>(i?'L':'M')+xs(p[0]).toFixed(1)+' '+ys(p[1]).toFixed(1)).join(' ');

 <path d="${d} L${xs(600)} ${y0} L${xs(0)} ${y0}Z" fill="url(#gA)"/><path d="${d}" fill="none" stroke="#7c93ff" stroke-width="2.2"/>

const P=sel=>{const it=sel.map(byId),spend=it.reduce((s,x)=>s+x.cost,0),by=(f)=>it.filter(f).reduce((s,x)=>s+x.cost,0),sh=v=>spend>0?v/spend:0;
 const cat={};CATS.forEach(c=>cat[c]=sh(by(x=>x.cat===c)));const quick=sh(by(x=>x.ty==='quick')),sys=sh(by(x=>x.ty==='sys')),mid=1-quick-sys;
 let H=0;CATS.forEach(c=>{if(cat[c]>0)H-=cat[c]*Math.log(cat[c])});const div=H/Math.log(4),cov=Math.min(1,(cat.lead+cat.well)/.5),util=Math.min(1,spend/9000);
 const d=sys<.55?.55-sys:sys>.7?sys-.7:0,sysS=Math.max(0,1-d/.5),idx=spend>0?100*(.4*sysS+.3*div+.2*cov+.1*util):0;

 const Re=it.reduce((s,x)=>s+x.e,0),Rr=it.reduce((s,x)=>s+x.r,0),reach=clamp(300/S.n,.15,1),B0=bidx(S.enps,S.attr,S.freq),eff=.6+.4*B0/100;
 const eg=22*(1-Math.exp(-Re*reach/70)),red=S.attr*S.prev/100*.5*(1-Math.exp(-Rr*reach/100))*eff,avoided=S.n*red/100,val=avoided*cpd(),roi=spend>0?(val-spend)/spend*100:0;
 return{it,spend,left:BUDGET-spend,cat,quick,sys,mid,idx,st,eg,red,a1:S.attr-red,avoided,val,roi,be:cpd()>0?spend/cpd():0}};
function suggest(){let best=null,bi=-1;for(let m=1;m<1<<INIT.length;m++){let sp=0;for(let i=0;i<INIT.length;i++)if(m>>i&1){sp+=INIT[i].cost;if(sp>BUDGET)break}if(sp>BUDGET)continue;
  const sel=INIT.filter((_,i)=>m>>i&1).map(x=>x.id),p=P(sel);if(p.st!=='st_bal')continue;const sc=p.idx+p.eg*.3+p.red*2;if(sc>bi){bi=sc;best=sel}}return best||S.sel}
