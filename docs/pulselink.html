<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseLink | HR Workflow Demo</title><link rel="stylesheet" href="executive.css"><style>[hidden]{display:none!important}body{font-family:Inter,Arial,sans-serif;margin:0;color:#f1f0eb}main{max-width:1150px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid #434b58;padding-bottom:20px}header a{color:#b8ff3b}h1{font-size:clamp(34px,6vw,62px);letter-spacing:-2px;margin:28px 0 15px}.demo-note{color:#b9c2d2;font:13px/1.6 Arial;max-width:760px}.flow-buttons{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}button{font:14px Arial;padding:13px 18px;background:#253248;color:#fff;border:1px solid #60718a;border-radius:5px;cursor:pointer;min-height:44px}button[aria-pressed=true],button.primary{background:#b8ff3b;color:#101116;border-color:#b8ff3b}button:disabled{opacity:.45;cursor:default}.workspaces{display:grid;grid-template-columns:1fr 1fr;gap:24px}.workspace{padding:24px;background:#1b1d22;border:1px solid #434b58;border-radius:7px}.workspace.hr{background:#f3f1e9;color:#101116}.workspace h2{font-size:22px;margin:0 0 22px}.bubble{padding:16px 18px;border-radius:12px;background:#2b3e58;max-width:90%;font:14px/1.6 Arial;margin:14px 0}.bubble.you{background:#1638e2;margin-left:auto}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.state{padding:16px 0;border-top:1px solid #8b939e;font-size:14px;line-height:1.65}.hr .primary{background:#1638e2;color:#fff;border-color:#1638e2}.hr button{background:transparent;color:#101116;border:1px solid #59606b}.hr button:disabled{opacity:.4}.kicker{font:11px monospace;letter-spacing:1px}.language{display:flex;gap:7px}.language button{padding:8px;font-size:12px}#consent{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:13px;line-height:1.5}input{width:20px;height:20px;accent-color:#1638e2}#log{font:12px/1.8 monospace;color:#404753;white-space:pre-line}footer{font:12px/1.6 Arial;color:#b9c2d2;padding-top:25px}a{color:inherit}@media(max-width:700px){main{padding:18px}.workspaces{grid-template-columns:1fr}.workspace{padding:20px}.bubble{max-width:100%}}</style><main><header><a href="portfolio.html#tools">DL● / PULSELINK</a><span class="kicker">WORKFLOW DEMO / NO INTEGRATIONS</span><div class="language" id="language"></div></header><h1 id="title"></h1><p class="demo-note" id="note"></p><div class="flow-buttons" id="flows"></div><div class="workspaces"><section class="workspace"><h2 id="employee-title"></h2><div id="chat" aria-live="polite"></div><label id="consent"><input id="allow" type="checkbox"><span id="consent-label"></span></label><div class="actions"><button id="next" class="primary"></button><button id="reset"></button></div></section><section class="workspace hr"><h2 id="manager-title"></h2><div id="request" class="state" aria-live="polite"></div><div class="actions"><button id="approve" class="primary"></button><button id="decline"></button></div><p class="kicker" id="history-label"></p><div id="log" aria-live="polite"></div></section></div><footer id="footer"></footer></main><script src="pulse-demo.js"></script></html>
